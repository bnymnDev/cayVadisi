# Manuelles Deployment nach cayvadisi.nesbun.de (Mittwald PHP-App).
# Der SSH-Key kommt als workflow_dispatch-Input und gehört zu einem temporären,
# ablaufenden Mittwald-SSH-User — nach dem Deploy wird der User gelöscht.
name: Deploy nesbun
on:
  workflow_dispatch:
    inputs:
      ssh_key:
        description: 'Deploy-Key (leer = Repo-Secret DEPLOY_SSH_KEY)'
        required: false
      ssh_user:
        description: 'Mittwald-SSH-User (leer = Repo-Secret DEPLOY_SSH_USER)'
        required: false
      target:
        description: 'Zielverzeichnis auf dem Webspace'
        required: false
        default: '/home/p-ng6rad/html/cayvadisi-php-k0qxx'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rsync zum Webspace
        env:
          KEY: ${{ inputs.ssh_key || secrets.DEPLOY_SSH_KEY }}
          SSHUSER: ${{ inputs.ssh_user || secrets.DEPLOY_SSH_USER }}
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -l $SSHUSER@p-ng6rad"
          echo "Zielverzeichnis: $TARGET"
          test -n "$TARGET"
          $SSH ssh.lashorst.project.host "mkdir -p $TARGET"
          rsync -rz --checksum --stats -e "$SSH" \
            --exclude '.git*' --exclude '.github' --exclude '.claude' \
            --exclude 'tools' --exclude 'tests' --exclude 'node_modules' \
            ./ ssh.lashorst.project.host:"$TARGET"/
          echo '--- Live-Check ---'
          $SSH ssh.lashorst.project.host "grep -m1 'const CACHE' $TARGET/sw.js"
