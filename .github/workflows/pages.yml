name: Publish to gh-pages

# Spiegelt main auf den gh-pages-Branch. GitHub Pages (Source: gh-pages)
# liefert die Seite dann unter https://bnymndev.github.io/cayVadisi/ aus.
# Hinweis: Die Pages-API zum automatischen Aktivieren ist dem Actions-Token
# verwehrt ("Resource not accessible by integration") — falls die Seite nicht
# erscheint, einmalig unter Settings -> Pages -> Source: "gh-pages" wählen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
