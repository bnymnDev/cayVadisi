<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Çay Vadisi — Teetal am Schwarzen Meer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ===== Start / Laden ===== -->
<div id="start-screen" class="overlay">
  <div class="start-card">
    <div class="start-lang">
      <button id="lang-de" class="lang-btn active">Deutsch</button>
      <button id="lang-tr" class="lang-btn">Türkçe</button>
    </div>
    <h1 class="title">ÇAY VADİSİ</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <div class="loading-row">
      <div id="load-bar"><div id="load-fill"></div></div>
      <div id="load-label">0%</div>
    </div>
    <button id="btn-start" class="big-btn" disabled data-i18n="start"></button>
    <button id="btn-continue" class="big-btn ghost hidden" data-i18n="continue"></button>
    <div class="controls-hint" id="controls-hint"></div>
    <div class="credits" data-i18n="credits"></div>
  </div>
</div>

<!-- ===== HUD ===== -->
<div id="hud" class="hidden">
  <div id="hud-top-left">
    <div id="hud-day"></div>
    <div id="hud-clock"></div>
    <div id="hud-weather"></div>
  </div>
  <div id="hud-top-right">
    <div id="hud-money"></div>
    <div id="hud-tier"></div>
    <button id="btn-manage" class="hud-btn" title="Betrieb [Tab]">💼</button>
    <button id="btn-life" class="hud-btn" title="Leben [P]">👤</button>
  </div>
  <div id="hud-speed" class="hidden"></div>
  <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
  <div id="hud-order"></div>
  <div id="hud-basket">
    <div id="basket-label"></div>
    <div id="basket-bar"><div id="basket-fill"></div></div>
    <div id="basket-quality"></div>
  </div>
  <div id="crosshair">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle id="ch-dot" cx="28" cy="28" r="2.2" fill="rgba(255,255,255,.85)"/>
      <circle id="ch-ring" cx="28" cy="28" r="16" fill="none" stroke="rgba(255,255,255,.9)"
              stroke-width="3" stroke-dasharray="100.5" stroke-dashoffset="100.5"
              transform="rotate(-90 28 28)"/>
    </svg>
  </div>
  <div id="interact-prompt" class="hidden"></div>
  <div id="marker-hut" class="world-marker hidden"><span>⚖</span><em></em></div>
  <div id="toast-stack"></div>
  <div id="popup-layer"></div>
  <div id="rain-warn" class="hidden"></div>

  <!-- Touch-Steuerung (nur auf Touch-Geräten sichtbar) -->
  <div id="touch-controls" class="hidden">
    <div id="joystick" class="tc"><div id="joystick-knob"></div></div>
    <div id="touch-buttons" class="tc">
      <button id="tbtn-brake" class="tc-btn hidden">▼</button>
      <button id="tbtn-gas" class="tc-btn hidden">▲</button>
    </div>
  </div>
</div>

<!-- ===== Shop / Verkauf ===== -->
<div id="shop-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="shopTitle"></h2>
    <div id="sell-box">
      <div id="sell-info"></div>
      <button id="btn-sell" class="big-btn"></button>
    </div>
    <h3 data-i18n="upgrades"></h3>
    <div id="upgrade-list"></div>
    <button id="btn-shop-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Hof (Pflanzen & Tiere) ===== -->
<div id="farm-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="farmTitle"></h2>
    <div id="farm-plots-info" class="section-info"></div>
    <h3 data-i18n="plantSection"></h3>
    <div id="plant-list"></div>
    <h3 data-i18n="animalSection"></h3>
    <div id="animal-list"></div>
    <button id="btn-farm-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Markt ===== -->
<div id="market-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="marketTitle"></h2>
    <div class="section-info" data-i18n="marketHint"></div>
    <div id="market-list"></div>
    <button id="btn-market-sellall" class="big-btn"></button>
    <button id="btn-market-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Autohaus ===== -->
<div id="dealer-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="dealerTitle"></h2>
    <div id="dealer-list"></div>
    <button id="btn-dealer-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Betrieb (Arbeiter / Lager / Bilanz) ===== -->
<div id="manage-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="manageTitle"></h2>
    <div class="tab-row">
      <button id="tab-workers" class="tab-btn active" data-i18n="tabWorkers"></button>
      <button id="tab-storage" class="tab-btn" data-i18n="tabStorage"></button>
      <button id="tab-stats" class="tab-btn" data-i18n="tabStats"></button>
    </div>
    <div id="manage-body"></div>
    <button id="btn-manage-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Reisen (İskele) ===== -->
<div id="travel-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="travelTitle"></h2>
    <div class="section-info" data-i18n="travelHint"></div>
    <div id="travel-list"></div>
    <button id="btn-travel-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Fabrik ===== -->
<div id="factory-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="factoryTitle"></h2>
    <div id="factory-body"></div>
    <h3 data-i18n="exportTitle"></h3>
    <div id="export-list"></div>
    <button id="btn-factory-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Supermarkt ===== -->
<div id="super-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="superTitle"></h2>
    <div id="super-body"></div>
    <button id="btn-super-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Leben (Profil, Familie, Immobilien, Aktien) ===== -->
<div id="life-screen" class="overlay hidden">
  <div class="panel">
    <h2 data-i18n="lifeTitle"></h2>
    <div class="tab-row">
      <button id="ltab-profile" class="tab-btn active" data-i18n="ltabProfile"></button>
      <button id="ltab-family" class="tab-btn" data-i18n="ltabFamily"></button>
      <button id="ltab-estate" class="tab-btn" data-i18n="ltabEstate"></button>
      <button id="ltab-stocks" class="tab-btn" data-i18n="ltabStocks"></button>
    </div>
    <div id="life-body"></div>
    <button id="btn-life-close" class="big-btn ghost" data-i18n="back"></button>
  </div>
</div>

<!-- ===== Pause ===== -->
<div id="pause-screen" class="overlay hidden">
  <div class="panel narrow">
    <h2 data-i18n="paused"></h2>
    <button id="btn-resume" class="big-btn" data-i18n="resume"></button>
    <div class="pause-row">
      <span data-i18n="sound"></span>
      <button id="btn-sound" class="toggle-btn"></button>
    </div>
    <div class="pause-row">
      <span data-i18n="quality"></span>
      <button id="btn-quality" class="toggle-btn"></button>
    </div>
    <div class="pause-row">
      <span data-i18n="language"></span>
      <button id="btn-lang" class="toggle-btn"></button>
    </div>
    <button id="btn-help" class="big-btn ghost" data-i18n="help"></button>
    <button id="btn-restart" class="big-btn danger" data-i18n="restart"></button>
  </div>
</div>

<!-- ===== Tagesabschluss ===== -->
<div id="day-screen" class="overlay hidden">
  <div class="panel narrow">
    <h2 id="day-title"></h2>
    <div id="day-stats"></div>
    <button id="btn-next-day" class="big-btn"></button>
  </div>
</div>

<!-- ===== Saisonende ===== -->
<div id="season-screen" class="overlay hidden">
  <div class="panel narrow">
    <div id="season-medal"></div>
    <h2 id="season-title"></h2>
    <div id="season-stats"></div>
    <button id="btn-season-continue" class="big-btn" data-i18n="keepPlaying"></button>
  </div>
</div>

<!-- ===== Cinematic-Intro ===== -->
<div id="cinema" class="hidden">
  <div class="cinema-bar top"></div>
  <div class="cinema-bar bottom"></div>
  <div id="cinema-text"></div>
  <button id="btn-skip-cinema" data-i18n="introSkip"></button>
</div>

<div id="vignette"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
