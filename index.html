<script>
// v20.1: Boot-Wächter — hängt das Laden (alter Service-Worker-Mix-Cache) oder
// wirft ein Modul beim Start einen Fehler, erscheint ein Reparatur-Button,
// der Service Worker und Caches komplett leert und frisch lädt.
(function () {
  var broken = false;
  function showFix() {
    var b = document.getElementById('btn-fix-cache');
    if (!b || !b.classList.contains('hidden')) return;
    b.classList.remove('hidden');
    b.onclick = async function () {
      try {
        if (navigator.serviceWorker) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) await r.unregister();
        }
        if (window.caches) {
          var keys = await caches.keys();
          for (var k of keys) await caches.delete(k);
        }
      } catch (e) { /* trotzdem neu laden */ }
      location.reload(true);
    };
  }
  window.addEventListener('error', function () { broken = true; showFix(); });
  window.addEventListener('unhandledrejection', function () { broken = true; });
  setTimeout(function () {
    var btn = document.getElementById('btn-start');
    var label = document.getElementById('load-label');
    if (btn && btn.disabled && label && (label.textContent === '0%' || broken)) showFix();
  }, 20000);
  setTimeout(function () {
    var btn = document.getElementById('btn-start');
    if (btn && btn.disabled) showFix();   // nach 90 s definitiv etwas faul
  }, 90000);
})();
</script>
